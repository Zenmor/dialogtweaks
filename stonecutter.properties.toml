[mod]
id = "dialogtweaks"
name = "DialogTweaks"
group = "me.zenmor"
version = "0.1.0"
channel_tag = ""
description = "Tweaks for Minecraft dialog screens"
authors = ["Zenmor"]
contributors = []
inception_year = "2026"
license.name = "MIT"
license.url = "https://opensource.org/licenses/MIT"
license.dist = "repo"
sources_url = "https://github.com/PLACEHOLDER/dialogtweaks"
homepage_url = "https://github.com/PLACEHOLDER/dialogtweaks"
issues_url = "https://github.com/PLACEHOLDER/dialogtweaks/issues"
discord_url = ""
environment = "client_only"
dev_jvm_args = [
	"-XX:+IgnoreUnrecognizedVMOptions",
	"-XX:+UseZGC",
	"-XX:+HeapDumpOnOutOfMemoryError",
	"-XX:HeapDumpPath=heapdump.hprof",
	"-XX:+ShowCodeDetailsInExceptionMessages",
	"-XX:+UseCompactObjectHeaders",
	"-XX:+AlwaysPreTouch",
	"-XX:+UseStringDeduplication",
	"-Dfile.encoding=UTF-8"
]
dev_jvm_args_mixin_debug = [
	"-Dmixin.env.remapRefMap=true",
	"-Dmixin.debug.verbose=true",
	"-Dmixin.debug.verify=true",
	"-Dmixin.debug.countInjections=true",
	"-Dmixin.debug=true",
	"-Dmixin.debug.export=true"
]
[[mod.pom.developers]]
id = "zenmor"
name = "Zenmor"
url = "https://github.com/ghost"

[fabric]
deps.fabric-loader = "0.19.5"

[fabric."1.21.11"]
deps.minecraft = "1.21.11"
deps.fabric-api = "0.141.6+1.21.11"
deps.modmenu = "17.0.1-beta.1"

[fabric."26.1.2"]
deps.minecraft = "26.1.2"
deps.fabric-api = "0.155.3+26.1.2"
deps.modmenu = "18.0.0-alpha.8"
publish.additionalVersions = ["26.1.1", "26.1"]

[fabric."26.2"]
deps.minecraft = "26.2"
deps.fabric-api = "0.161.0+26.2"
deps.modmenu = "20.0.2"

[fabric."26.3"]
deps.minecraft = "26.3"
deps.fabric-api = "0.165.2+26.3"
deps.modmenu = "21.0.0"
